<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>좀비와 드래곤 · 로비 미리보기</title>
<link rel="stylesheet" href="/src/styles/reset.css">
<link rel="stylesheet" href="/src/styles/pixel-ui.css">
<link rel="stylesheet" href="/src/styles/screens.css">
<!--
  그림 담당 점검용 — 진짜 IanDragonGameLobby.js 를 로그인 없이 띄운다 (profile.js 만 대역 tools/_dragon-stub.js 로 바꿈).
  «모험 시작»을 누르면 진짜 게임 화면(IanDragonGame.js)으로 넘어간다. 게임 코드는 고치지 않는다.
-->
<script type="importmap">
{ "imports": { "/src/services/profile.js": "/tools/_dragon-stub.js" } }
</script>
</head>
<body class="ui-mode">
<div id="ui" class="active"></div>
<script type="module">
import Lobby from '/src/screens/IanDragonGameLobby.js';
const root = document.getElementById('ui');
const stack = [];
/* ?skin=a|b : 새 그림 옷 입혀 보기 (lobby-skin.css · 이 미리보기에서만) */
const skin = new URLSearchParams(location.search).get('skin');
if (skin) {
  document.head.append(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: '/tools/idg-gallery/lobby-skin.css?v=' + Date.now() }));
  root.classList.add('idg-skin');
  root.style.setProperty('--skin-bg', `url(/assets/iandragon_game/ai/lobby/bg_${skin}.webp)`);
}
const ICO = [['스테이지', 'ico_stages'], ['둥지', 'ico_nest'], ['부화장', 'ico_hatch'], ['연구소', 'ico_lab'], ['과제', 'ico_quests'], ['도감', 'ico_codex'], ['하는 법', 'ico_how'], ['오락실', 'ico_arcade']];
function decorate() {
  if (!skin || stack.length > 1) return;
  for (const b of root.querySelectorAll('.pbtn:not(.primary)')) {
    const hit = ICO.find(([t]) => b.textContent.includes(t));
    if (hit) { b.dataset.ico = hit[1]; b.style.setProperty('--ico', `url(/assets/iandragon_game/ai/lobby/${hit[1]}.png)`); }
  }
}
const nav = {
  refresh() { const top = stack[stack.length - 1]; if (!top) return; top.destroy?.(); root.replaceChildren(); const v = top.render(nav); if (v) root.append(v); top.mounted?.(root); root.classList.toggle('idg-skin', !!skin && stack.length === 1); decorate(); },
  push(f) { stack.push(f(nav)); root.classList.toggle('wide', stack.length > 1); nav.refresh(); },
  back() { stack.pop()?.destroy?.(); root.classList.toggle('wide', stack.length > 1); nav.refresh(); },
  reset(f) { stack.length = 0; nav.push(f); },
};
nav.push(Lobby);
window.__nav = nav;
</script>
</body></html>
