<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>레이스 게이지 미리보기 (진단 전용)</title>
<style>body{margin:0;background:#222;display:flex;justify-content:center}canvas{image-rendering:pixelated}</style>
</head><body>
<canvas id="game" width="180" height="320"></canvas>
<script type="module">
import { initCanvas, clear, getCanvas } from '/src/core/canvas.js';
import { loadAll } from '/src/core/assets.js';
import { multiHud } from '/src/game/multiHud.js';
import { loadSmallFont } from '/src/core/pixelfont.js';

initCanvas();
const chars = ['ian', 'denny', 'rose', 'tony'];
await loadAll(chars.flatMap((id) => [
  { key: `${id}_face`, url: `/assets/characters/${id}_face.png` },
  { key: `${id}_front`, url: `/assets/characters/${id}_front.png` },
]).concat([{ key: 'bubble_first', url: '/assets/ui/bubble_first.png' }])).catch(() => {});

const now = Date.now();
const scene = {
  floor: 320, charId: 'ian', mySlot: 0, myRevives: 2, multi: { myUid: 'a' },
  countdownMs: 0, shoesFound: 3,
  stairs: { worldX: (f) => f * 30, nextDir: () => 1, ensure() {} },
  room: { players: {
    a: { stairs: 320, alive: true, revives: 2 },
    b: { stairs: 300, alive: true, revives: 1 },
    c: { stairs: 350, alive: false, revives: 4, deadAt: now - 3000 },
    d: { stairs: 290, alive: true, revives: 6 },
  }, result: { given: { a: new Array(40).fill(1), b: new Array(20).fill(1) } } },
  opponents: [
    { id: 'b', characterId: 'denny', slot: 1, stairs: 300, revives: 1, alive: true },
    { id: 'c', characterId: 'rose', slot: 2, stairs: 350, revives: 4, alive: false, deadAt: now - 3000 },
    { id: 'd', characterId: 'tony', slot: 3, stairs: 290, revives: 6, alive: true },
  ],
  // 낙사(빨강)·부활(노랑) 두 색이 한 화면에 같이 뜨는 경우를 일부러 만든다
  ticker: [
    { msg: '파란색이 떨어졌다!', color: '#D42B2B', until: Date.now() + 9e5 },
    { msg: '노란색 1등 부활!', color: '#F2C23C', until: Date.now() + 9e5 },
  ],
};
/**
 * ★ **7px 폰트를 먼저 기다린다.** (2026-08-19 14차)
 * `multiHud` 는 자기가 부를 때 비동기로 받아 오고, 아직 안 왔으면 11px 로 그린다
 * (그게 정상 폴백이다). 그런데 미리보기는 **한 번 그리고 끝**이라 늘 폴백만 찍혀서
 * 판돈·등수 줄이 실제보다 크게 나온다 — 그 그림을 보고 "안 줄었다"고 오판할 뻔했다.
 */
await loadSmallFont();
clear('#243a52');
multiHud(scene);

window.__ready = true;
</script></body></html>
