<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>결투 두 사람 시늉</title>
<style>body{background:#111;color:#ddd;font:13px/1.7 monospace;padding:16px;white-space:pre}</style>
</head><body><div id="out">돌리는 중…</div><div id="host" style="display:none"></div>
<script type="module">
/**
 * **결투를 두 사람 몫으로 돌려 본다.**
 *
 * 진짜 방을 열지 않고, 게임 모듈 하나를 **번갈아 두 번** 돌린다.
 * 한쪽이 내보낸 고스트(`onGhost`)를 다른 쪽에 넣어 주는 것으로 방을 흉내낸다.
 *
 * 여기서 확인하려는 것은 셋이다:
 *
 *   1. **같은 씨앗이면 금화가 같은 자리에 뜬다** — 겨루는 대상이 같아야 한다
 *   2. **먼저 먹은 사람 것이 된다** — 상대가 먹은 번호는 내 화면에서 사라진다
 *   3. **한 명이 죽으면 둘 다 끝난다**
 *
 * 1번이 깨지면 "내 화면에서는 있었는데" 가 생기고, 2번이 깨지면 금화가 복제된다.
 * 둘 다 눈으로는 절대 못 잡는 종류라 숫자로 본다.
 */
import * as DR from '/src/games/dragon/dragon.js';

const lines = []; const say = (s) => lines.push(s);
const show = () => { document.getElementById('out').textContent = lines.join('\n'); };
let fails = 0;
const check = (ok, msg) => { if (!ok) { fails++; say('  X ' + msg); } else say('  o ' + msg); };

const host = document.getElementById('host');
const DT = 1 / 60;
const SEED = 987654;

/** 한 사람 몫을 씨앗으로 열고, 몇 초 돌린 뒤 화면에 남은 금화 번호를 돌려준다 */
function playOnce(seconds, { peerTook = [], bot = null } = {}) {
  DR.unmount(); host.innerHTML = '';
  const ghosts = [];
  DR.mount(host, {
    onExit() {}, onEnd() {}, onProgress() {},
    onGhost(g) { ghosts.push(g); },
    difficulty: 'normal', mode: 'duel', code: 'SIM', seed: SEED,
  });
  const T = DR.__test;
  for (let i = 0; i < 400 && T.scene !== 'GameScene'; i++) { T.press('confirm'); T.pump(DT); }
  DR.setDuelPeer({ alive: true, name: '상대', dragon: 3, took: peerTook });
  const sc = T.scene0();
  let t = 0;
  while (t < seconds && sc.state === 'play') {
    if (bot) bot(sc, T);
    T.pump(DT); t += DT;
  }
  const coins = sc.items.filter((i) => !i.dead && i.no !== undefined).map((i) => i.no);
  return { sc, T, coins, ghosts, took: sc.took.slice(), coinN: sc.coinN, t };
}

say('=== 1. 같은 씨앗이면 금화가 같은 자리에 뜬다 ===');
{
  const a = playOnce(6);
  /**
   * ★ **번호로 대조한다.** 차례로 늘어놓고 i 번째끼리 견주면, 한쪽에서 하나가
   *   사라지는 순간 그 뒤가 전부 밀려 **자리가 같은데도 다르다고 나온다.**
   */
  const yMap = (r) => {
    const m = {};
    for (const it of r.sc.items) if (!it.dead && it.no !== undefined) m[it.no] = Math.round(it.y);
    return m;
  };
  const mA = yMap(a);
  const b = playOnce(6);
  const mB = yMap(b);
  check(a.coinN === b.coinN, '같은 시간에 같은 개수를 뿌린다 (' + a.coinN + ' vs ' + b.coinN + ')');
  /**
   * ★ **몇 픽셀 안이면 같은 자리다.** 완전일치를 요구하면 안 된다 —
   *   금화는 매 프레임 조금씩 흔들리고(`y += sin(t)*38*dt`), 그 덧셈이 수백 번
   *   쌓이면 부동소수점 끝자리가 갈린다. 실제로 재 보면 **1픽셀**이다.
   *   여기서 지키려는 것은 "두 화면에서 같은 자리" 이지 비트 단위 일치가 아니다.
   */
  const TOL = 4;
  const 공통 = Object.keys(mA).filter((n) => n in mB);
  const 어긋남 = 공통.filter((n) => Math.abs(mA[n] - mB[n]) > TOL);
  const 최대차 = Math.max(0, ...공통.map((n) => Math.abs(mA[n] - mB[n])));
  check(공통.length > 0 && 어긋남.length === 0,
    '번호마다 같은 높이에 뜬다 (견준 것 ' + 공통.length + ' / 최대차 ' + 최대차 + 'px)');
  say('    ' + 공통.slice(0, 6).map((n) => n + ':' + mA[n]).join('  '));
}
show();

say('=== 2. 먼저 먹은 사람 것이 된다 ===');
{
  /* 상대가 0~7 번을 먹었다고 알린다 — 내 화면에서 사라져야 한다 */
  const bits = [0b11111111];
  const r = playOnce(8, { peerTook: bits });
  const 남음 = r.coins.filter((n) => n < 8);
  check(남음.length === 0, '상대가 먹은 0~7 번은 내 화면에 없다 (남은 것 ' + 남음.length + ')');
  check(r.coins.some((n) => n >= 8), '안 먹은 번호는 그대로 있다');
}
show();

say('=== 3. 내가 먹으면 번호가 새겨진다 ===');
{
  /* 봇이 금화를 쫓게 두면 실제로 먹는다 */
  const r = playOnce(10, { bot(sc) {
    const p = sc.p1;
    let best = null, bd = 1e9;
    for (const it of sc.items) {
      if (it.dead || it.no === undefined) continue;
      const d = Math.hypot(it.x - p.x, it.y - p.y);
      if (d < bd) { bd = d; best = it; }
    }
    if (best) {
      p.x += Math.max(-12, Math.min(12, best.x - p.x));
      p.y += Math.max(-12, Math.min(12, best.y - p.y));
    }
    if (p.hp < 100) p.hp = 100;          // 여기서 재려는 것은 금화지 생존이 아니다
  } });
  const 켜진비트 = r.took.reduce((n, w) => {
    let c = 0; for (let i = 0; i < 32; i++) if (w & (1 << i)) c++; return n + c;
  }, 0);
  check(켜진비트 > 0, '먹은 금화의 번호가 켜져 있다 (' + 켜진비트 + '개)');
  check(r.ghosts.length > 0, '고스트를 내보낸다 (' + r.ghosts.length + '번)');
  const g = r.ghosts[r.ghosts.length - 1];
  check(g && g.took && g.took.length > 0, '고스트에 먹은 번호가 실린다');
  check(g && g.lives >= 0 && g.lv >= 1, '고스트에 하트와 불레벨이 실린다');
}
show();

say('=== 4. 한 명이 죽으면 둘 다 끝난다 ===');
{
  DR.unmount(); host.innerHTML = '';
  let exits = 0;
  DR.mount(host, { onExit() { exits++; }, onEnd() {}, onProgress() {}, onGhost() {},
                   difficulty: 'normal', mode: 'duel', code: 'SIM', seed: SEED });
  const T = DR.__test;
  for (let i = 0; i < 400 && T.scene !== 'GameScene'; i++) { T.press('confirm'); T.pump(DT); }
  const sc = T.scene0();
  DR.setDuelPeer({ alive: false, coins: 5, name: '상대', dragon: 2, lives: 0 });
  for (let i = 0; i < 10; i++) T.pump(DT);
  check(sc.state === 'clear', '상대가 죽으면 내 판이 곧바로 끝난다 (' + sc.state + ')');
  check(sc.endReason === '상대 탈락', '끝난 이유가 남는다 (' + sc.endReason + ')');
  for (let i = 0; i < 90; i++) T.pump(DT);
  check(exits === 1, '1.1초 뒤 결과창으로 넘어간다 (onExit ' + exits + '번)');
  DR.unmount(); host.innerHTML = '';
}

say('');
say(fails === 0 ? '전부 통과' : (fails + '군데 실패'));
show();
window.__done = true; window.__fails = fails;
</script></body></html>
