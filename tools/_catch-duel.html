<!doctype html>
<!-- 캐치볼 대결 검사 — 두 판을 나란히 띄우고 BroadcastChannel 로 잇는다. ?auto=1 이면 둘 다 자동
     &w3d=ab 둘 다 3D (3D캐치볼) · &w3d=a 왼쪽만 3D (2D 친구와 3D 친구가 한 방) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>catch duel</title>
<style>
  html,body{margin:0;height:100%;background:#222;font:13px sans-serif;color:#ddd}
  .wrap{display:flex;gap:10px;padding:10px}
  iframe{width:390px;height:720px;border:0;background:#000}
  pre{margin:4px 0 0;white-space:pre-wrap;width:390px;min-height:40px}
</style>
</head>
<body>
<div class="wrap">
  <div><iframe id="a"></iframe><pre id="la"></pre></div>
  <div><iframe id="b"></iframe><pre id="lb"></pre></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const room = Math.random().toString(36).slice(2, 8);
  const extra = (q.get('auto') ? '&auto=1' : '') + (q.get('hit') ? '&hit=' + q.get('hit') : '') + (q.get('diff') ? '&diff=' + q.get('diff') : '');
  const w3d = q.get('w3d') || '';
  for (const k of ['a', 'b']) document.getElementById(k).src = `_catch-harness.html?mode=duel&side=${k}&room=${room}${extra}${w3d.includes(k) ? '&w3d=1' : ''}`;
  setInterval(() => {
    for (const k of ['a', 'b']) {
      try { document.getElementById('l' + k).textContent = document.getElementById(k).contentDocument.body.dataset.state || ''; } catch (e) {}
    }
  }, 300);
</script>
</body>
</html>
