<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>좀비와 드래곤 UI 키트 견본</title>
<style>
@font-face { font-family: 'PretendardV'; src: url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2'); font-weight: 45 920; font-display: block; }
html, body { margin: 0; background: #120b22 url(/assets/iandragon_game/ai/lobby/bg_tab.webp) center / cover fixed; min-height: 100%; }
body { padding: 10px 6px 24px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: flex-start; }
.idg-k-win { max-height: none !important; }
</style>
</head><body>
<script type="module">
/** UI 키트 견본 — 부품 전부 한 화면 (확인 · 캡처 전용, 게임에는 안 들어감) */
import { el } from '/src/screens/ui.js';
import * as K from '/src/screens/idgKit.js';

const I = '/assets/iandragon_game/ai/';
const noop = () => {};

// 1) 상점 견본 창 : 현판 · 지갑 판 · 고풍 탭 · 종이 안내 · 스크롤 목록 + 가격 단추 · 닫기
const shopRows = [
  ['왕관 모자', I + 'meta/hat_crown.png', { gem: 150 }],
  ['해적 모자', I + 'meta/hat_pirate.png', { coin: 8000 }],
  ['마법사 고깔', I + 'meta/hat_wizard.png', { coin: 12000, poor: true }],
  ['바이킹 투구', I + 'meta/hat_viking.png', { coin: 5000 }],
  ['호박 모자', I + 'meta/hat_pumpkin.png', { gem: 90 }],
].map(([t, ic, p]) => K.kitRow({ icon: ic, title: t, sub: '모자', right: K.kitPriceBtn({ ...p, size: 'sm', onClick: noop }) }));
const shop = K.kitWin({ title: '드래곤샵', cls: 'shop', body: [
  K.kitWallet({ coins: 14799, gems: 390 }),
  K.kitTabs({ old: true, label: '상점 칸', tabs: [{ id: 'deco', label: '꾸미기' }, { id: 'deal', label: '오늘의 특가' }, { id: 'item', label: '편의품' }], value: 'deco', onPick: noop }),
  K.kitPaper(['꾸미기는 멋만 내요. 힘은 세지지 않아요.', el('small', '테두리는 명예의 전당 · 칭호는 도전 과제로 얻어요')]),
  K.kitSection('모자'),
  K.kitScroll(shopRows, { height: '11.5em' }),
], foot: [K.kitBtn({ kind: 'purple', text: '닫기', onClick: noop })] });

// 2) 설정 견본 창 : 토글 · 슬라이더 · 체크 · 보라 탭 · 잠김 줄 · 알림 점 · X 닫기
const tabs = K.kitTabs({ label: '설정 칸', tabs: [{ id: 'snd', label: '소리' }, { id: 'play', label: '게임' }, { id: 'acc', label: '계정' }], value: 'snd', onPick: noop });
K.kitBadge(tabs.children[2]);
const set = K.kitWin({ title: '설정', onClose: noop, body: [
  tabs,
  K.kitRow({ icon: I + 'lobby/ico_music.png', title: '배경 음악', right: K.kitToggle({ on: true, label: '배경 음악' }) }),
  K.kitRow({ icon: I + 'lobby/ico_sound.png', title: '효과음', right: K.kitToggle({ on: false, label: '효과음' }) }),
  K.kitRow({ hi: true, icon: I + 'settings/ico_voice.png', title: '목소리 크기', sub: '이름 외침 · 대사', right: K.kitSlider({ value: 70, label: '목소리 크기' }) }),
  K.kitRow({ icon: I + 'settings/ico_zombie.png', title: '좀비 소리', right: K.kitSlider({ value: 25, label: '좀비 소리' }) }),
  K.kitRow({ icon: I + 'lobby/ico_raid.png', title: '레이드', sub: '3-1 을 깨면 열려요', locked: true }),
  el('div.idg-k-line.center.wrap', null, [K.kitCheck({ on: true, label: '진동' }), K.kitCheck({ on: false, label: '빠른 전투' })]),
] });

// 3) 단추 · 재화 · 글씨 단계 견본
const btns = K.kitWin({ title: '단추 · 글씨', body: [
  el('div.idg-k-line', null, [K.kitBtn({ kind: 'red', icon: I + 'result/ico_fight.webp', text: '전투 개시!', cls: 'grow' }), K.kitBtn({ kind: 'green', icon: I + 'result/ico_power.webp', text: '파워업' })]),
  el('div.idg-k-line.center.wrap', null, [K.kitBtn({ kind: 'purple', icon: I + 'result/ico_retry.svg', text: '다시하기' }), K.kitBtn({ kind: 'purple', icon: I + 'result/ico_exit.svg', text: '나가기' }), K.kitBtn({ kind: 'purple', text: '잠김', disabled: true })]),
  el('div.idg-k-line.center.wrap', null, [K.kitPriceBtn({ label: '사기', coin: 8000 }), K.kitPriceBtn({ gem: 150, tag: '10% 할인' }), K.kitPriceBtn({ coin: 99999, poor: true })]),
  el('div.idg-k-line.center.wrap', null, [K.kitCoin(606, { sign: '+' }), K.kitGem(15, { sign: '+' }), K.kitCoin(14799, { pill: true }), K.kitGem(390, { pill: true }), K.kitLock(), K.kitClose(noop)]),
  el('div.idg-k-col', null, [el('div.idg-k-t1', '큰 제목 t1'), el('div.idg-k-t2', '소제목 · 단추 t2'), el('div.idg-k-t3', '본문 · 목록 이름 t3'), el('div.idg-k-t4', '보조 설명 t4'), el('div.idg-k-t5', '아주 작은 꼬리 글 t5')]),
] });
btns.querySelector('.grow').style.flex = '1.5 1 0';

document.body.append(shop, set, btns);
</script>
</body></html>
