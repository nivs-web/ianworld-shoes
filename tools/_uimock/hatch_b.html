<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="data.js"></script>
<style>
.three { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: .6em; }
.egc { position: relative; display: flex; flex-direction: column; align-items: center; gap: .3em; padding: .5em .5em .6em; min-height: 0; border: 2px solid var(--o); border-radius: 10px; background: var(--bg2); }
.egc.rare { box-shadow: inset 0 0 0 2px #4aa0ff; } .egc.epic { box-shadow: inset 0 0 0 2px #c06aff; } .egc.leg { box-shadow: inset 0 0 0 2px var(--gold-hi); }
.egc .nm { font-size: 1.1em; } .egc .art { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; border-radius: 8px; background: radial-gradient(#4d3b80, #241a40 72%); }
.egc .art img { height: 72%; width: auto; max-width: 80%; object-fit: contain; }
.egc .pc { font-size: 1.5em; color: var(--gold-hi); line-height: 1; } .egc .sub { font-size: .7em; color: var(--sub); text-shadow: 1px 1px 0 var(--o); }
.buy { flex: none; display: flex; align-items: center; gap: .6em; }
.bar { flex: 1; height: 1.1em; border-radius: .6em; background: var(--bg2); border: 2px solid var(--o); box-shadow: inset 0 0 0 1px #5a4a8a; overflow: hidden; }
.bar u { display: block; height: 100%; width: 26%; background: linear-gradient(var(--gold-hi) 0 50%, var(--gold) 50%); }
.offt { padding: .1em .35em; border-radius: 5px; background: #ff3b30; box-shadow: 0 0 0 2px var(--o); font-size: .75em; font-style: normal; }
</style>
<div class="scene"></div>
<div class="win">
  <div class="head"><h1>부화장</h1><div class="grow"></div><span class="btn o">용 도감 ›</span><span id="cash"></span><div class="x">✕</div></div>
  <div class="body" style="flex-direction:column">
    <div class="three">
      <div class="egc rare"><div class="nm">희귀 알</div><div class="art"><img src="/assets/iandragon_game/ai/eggs/egg_rare.png"></div><div class="pc">70%</div><div class="sub">자주 나와요</div></div>
      <div class="egc epic"><div class="nm">슈퍼 알</div><div class="art"><img src="/assets/iandragon_game/ai/eggs/egg_super.png"></div><div class="pc">25%</div><div class="sub">가끔 나와요</div></div>
      <div class="egc leg"><div class="nm">전설 알</div><div class="art"><img src="/assets/iandragon_game/ai/eggs/egg_legend.png"></div><div class="pc">5%</div><div class="sub">아주 드물어요</div></div>
    </div>
    <div class="buy">
      <div class="paper" style="flex:1;padding:.3em .6em;text-align:left;display:flex;align-items:center;gap:.6em;white-space:nowrap">전설까지 <b>37번</b> 남음<div class="bar"><u></u></div></div>
      <span class="btn g" style="min-height:2.4em">알 1개 <img src="/assets/iandragon_game/ai/ui/gem.svg">100</span>
      <span class="btn g" style="min-height:2.4em">알 10개 <img src="/assets/iandragon_game/ai/ui/gem.svg">900 <i class="offt">-10%</i></span>
    </div>
  </div>
</div>
<script>tag('부화장 B — 알 세 개를 큰 카드로 나란히 (확률 크게) + 아래 천장 막대 · 사기 단추');</script>
