<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="data.js"></script>
<style>
.strip { display: flex; gap: .7em; overflow-x: auto; flex: 1; align-items: stretch; padding-bottom: .4em; }
.col { flex: 0 0 auto; display: flex; flex-direction: column; gap: .35em; }
.hero { width: 12em; flex: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: .6em; border: 2px solid var(--o); border-radius: 10px; background: linear-gradient(160deg, #6a3fc4, #2a1650); box-shadow: inset 0 0 0 2px var(--gold-hi); }
.hero > img { height: 5.5em; }
.two { display: grid; grid-template-rows: 1fr 1fr; grid-auto-flow: column; grid-auto-columns: 7.2em; gap: .45em; flex: 1; }
.two .card .art { height: 3em; } .two .card .art img { max-height: 2.7em; }

<div class="win">

  <div class="strip">
    <div class="col"><div class="sec">오늘의 특가 · 6시간 남음</div><div class="hero"><b>박쥐 깃발</b><img src="/assets/iandragon_game/ai/meta/flag_batflag.webp"><span class="fx" style="font-size:.7em;color:var(--sub)">캐슬 체력 +0.5%</span><span class="btn g wide"><img src="/assets/iandragon_game/ai/ui/coin.svg">2,030</span></div></div>
    <div class="col"><div class="sec">드래곤캐슬 꾸미기</div><div class="two" id="g1"></div></div>
    <div class="col"><div class="sec">브레스 · 오라</div><div class="two" id="g2"></div></div>
  </div>
</div>
