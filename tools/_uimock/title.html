<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="data.js"></script>
<style>
/* 제목 = 가운데 · 창 위 테두리 밖으로 살짝 튀어나옴 (11/14 대표님) — 머리 줄 : 왼쪽 비움(바로가기) · 가운데 제목 · 오른쪽 재화 + X */
.win { top: calc(50% + 1.1em); height: min(calc(92vh - 2.2em), 620px); overflow: visible; }
.head { position: relative; justify-content: flex-end; }
.head .side { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; }
.tt { position: absolute; left: 50%; top: calc(var(--fs) * -.7 - 3px); transform: translate(-50%, -42%); z-index: 3; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
.tt b { font-size: 1.45em; line-height: 1; color: #fff7d6; text-shadow: var(--t3); }
/* 1 폴더 탭 : 창과 같은 판이 위로 솟음 (그림 없음) */
.v1 .tt { height: 2.6em; padding: 0 1.8em; background: var(--bg); border: 3px solid var(--o); border-bottom: 0; border-radius: 14px 14px 0 0; box-shadow: inset 0 2px 0 0 var(--gold), inset 2px 0 0 0 var(--gold), inset -2px 0 0 0 var(--gold); transform: translate(-50%, -66%); }
.v1 .tt::after { content: ''; position: absolute; left: 2px; right: 2px; bottom: -4px; height: 6px; background: var(--bg); }
/* 2 화려한 알약 (결과 창 plate_pill) */
.v2 .tt { height: 2.7em; min-width: 13em; padding: 0 2.4em; border: solid transparent; border-width: .55em 1.6em; border-image: url(/assets/iandragon_game/ai/result/plate_pill.webp) 40 90 fill / .55em 1.6em stretch; }
/* 3 뾰족 현판 (plate_new) */
.v3 .tt { height: 2.5em; min-width: 12em; padding: 0 2em; border: solid transparent; border-width: .5em 1.4em; border-image: url(/assets/iandragon_game/ai/result/plate_new.webp) 30 70 fill / .5em 1.4em stretch; }
/* 6 = 3 뾰족 현판 다듬기 (11/14 대표님) : 갈색 → 창(다크 블루 보라)보다 살짝 어두운 색 · 2px 위로 · 그라데이션 · 금테 없이 두꺼운 검은 테만
 *  그림 대신 CSS : 바깥 검은 판(::before) 위에 3px 안쪽 색 판(::after) — 양 끝 뾰족 */
.v6 .tt { --pt: .9em; height: 2.4em; min-width: 12em; padding: 0 2.1em; top: calc(var(--fs) * -.7 - 5px); background: none; }
.v6 .tt::before, .v6 .tt::after { content: ''; position: absolute; z-index: -1; clip-path: polygon(var(--pt) 0, calc(100% - var(--pt)) 0, 100% 50%, calc(100% - var(--pt)) 100%, var(--pt) 100%, 0 50%); }
.v6 .tt::before { inset: 0; background: #0b0614; }
.v6 .tt::after { inset: 4px 5px; --pt: calc(.9em - 4px); background: #1a1230; }
/* 7 = 5 날개 현판 다듬기 (11/14 대표님) : 판 그라데이션 없음(한 색) · 글씨 검은 테 2px 만 · 꼬리 리본만큼 크게 (높이 2.8em · 폭 14em) · 날개도 같이 크게
 * 8 = 7 과 같은데 판 없이 날개 + 글씨만 (비교용) */
.v7 .tt, .v8 .tt { --wh: 3.5em; height: 2.8em; min-width: 14em; padding: 0 2em; top: calc(var(--fs) * -.7 - 5px); border: 3px solid #0b0614; border-radius: 1.4em; background: #1a1230; box-shadow: none; }
.v7 .tt b, .v8 .tt b { font-size: 1.6em; text-shadow: var(--t2); }
.v8 .tt { border: 0; background: none; }
.v7 .tt::before, .v7 .tt::after, .v8 .tt::before, .v8 .tt::after { content: ''; position: absolute; top: 50%; width: calc(var(--wh) * 175 / 196); height: var(--wh); margin-top: calc(var(--wh) * -.42); background: url(/assets/iandragon_game/ai/result/banner_win_open.webp) 0 0 / calc(var(--wh) * 720 / 196) var(--wh) no-repeat; }
.v7 .tt::before, .v8 .tt::before { right: calc(100% - 1em); }
.v7 .tt::after, .v8 .tt::after { left: calc(100% - 1em); background-position: calc(var(--wh) * -545 / 196) 0; }
/* 9 = 5 날개 현판 확정안 다듬기 (11/14 대표님) : 금테 알약 그대로 · 한 색(그라데이션 없음) · 알약 살짝 크게 · 좌우 여백 = 양쪽에 2글자씩 더 들어갈 만큼
 *  · 글씨 검은 테 2px · 현판 전체(날개 포함)에 살짝 그림자 → 아래 창에 비침 (딱딱한 도트 그림자 · 번짐 없음) */
.v9 .tt { --wh: 3.1em; height: 2.5em; padding: 0 3.1em; top: calc(var(--fs) * -.7 - 5px); border: 3px solid var(--o); border-radius: 1.3em; background: #2c2150; box-shadow: inset 0 0 0 2px var(--gold); filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .45)); }
.v9 .tt b { font-size: 1.5em; text-shadow: var(--t2); }
.v9 .tt::before, .v9 .tt::after { content: ''; position: absolute; top: 50%; width: calc(var(--wh) * 175 / 196); height: var(--wh); margin-top: calc(var(--wh) * -.42); background: url(/assets/iandragon_game/ai/result/banner_win_open.webp) 0 0 / calc(var(--wh) * 720 / 196) var(--wh) no-repeat; }
.v9 .tt::before { right: calc(100% - .55em); }
.v9 .tt::after { left: calc(100% - .55em); background-position: calc(var(--wh) * -545 / 196) 0; }
/* 10 = 날개 현판 최종 다듬기 (11/14 대표님)
 *  알약 : 살짝 밝은 파랑 · 위 밝고 아래 살짝 어두움(딱 나뉜 두 색 + 윗면 빛줄) · 더 밝은 금테 · 좌우 여백 = 양쪽 1글자 반
 *  글씨 : 테 2px (7번과 같은 굵기) · 위 절반 = 지금 색 · 아래 절반 = 살짝 어둡게 · 오른쪽 아래 2px 딱딱한 그림자 (번짐 없음)
 *  날개 : 살짝 크게 · 조금 더 위로 들림 */
.v10 .tt { --wh: 3.6em; height: 2.5em; padding: 0 2.25em; top: calc(var(--fs) * -.7 - 5px); border: 3px solid var(--o); border-radius: 1.3em;
  background: linear-gradient(#5a8ef0 0 50%, #3f6fd6 50% 100%); box-shadow: inset 0 0 0 2px #ffe680, inset 0 4px 0 0 #9cc0ff, 2px 2px 0 0 rgba(0, 0, 0, .55); }
.v10 .tt b { position: relative; font-size: 1.55em; color: #fff7d6;
  text-shadow: 2px 0 var(--o), -2px 0 var(--o), 0 2px var(--o), 0 -2px var(--o), 2px 2px var(--o), -2px 2px var(--o), 2px -2px var(--o), -2px -2px var(--o),
    4px 4px 0 #000, 3px 4px 0 #000, 4px 3px 0 #000, 4px 2px 0 #000, 2px 4px 0 #000, 4px 0 0 #000, 0 4px 0 #000; }
.v10 .tt b::after { content: attr(data-t); position: absolute; inset: 0; color: transparent; text-shadow: none; background: linear-gradient(#fff7d6 0 52%, #d9c690 52% 100%); -webkit-background-clip: text; background-clip: text; }
.v10 .tt::before, .v10 .tt::after { content: ''; position: absolute; top: 50%; z-index: -1; width: calc(var(--wh) * 175 / 196); height: var(--wh); margin-top: calc(var(--wh) * -.62); background: url(/assets/iandragon_game/ai/result/banner_win_open.webp) 0 0 / calc(var(--wh) * 720 / 196) var(--wh) no-repeat; filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, .5)); }
.v10 .tt::before { right: calc(100% - .7em); transform: rotate(8deg); transform-origin: 100% 60%; }
.v10 .tt::after { left: calc(100% - .7em); background-position: calc(var(--wh) * -545 / 196) 0; transform: rotate(-8deg); transform-origin: 0 60%; }
/* 11 = 날개 현판 (11/14 대표님 정정) : 날개 = 5·9번 자리 · 방향 그대로, 크기만 아주 살짝(3.1 → 3.3em · 원본 196px 를 줄여 쓰는 것이라 안 깨짐)
 *  알약 = 9번 보라 남색 그대로 · 위쪽만 살짝 밝게 둥근 입체 · 금테 = 너무 밝지 않게, 위쪽에 날개처럼 반짝 · 글씨 크기 = 처음(1.45em) 그대로 */
.v11 .tt { --wh: 3.3em; height: 2.5em; padding: 0 2.2em; top: calc(var(--fs) * -.7 - 5px); border: 2px solid transparent; border-radius: 1.3em;
  background: linear-gradient(#433578 0%, #34296a 45%, #2c2150 55%, #261c48 100%) padding-box,
              linear-gradient(#fff0b8 0%, #f2c45a 30%, #d9a441 60%, #a8742a 100%) border-box;
  box-shadow: 0 0 0 3px var(--o), inset 0 3px 0 0 rgba(160, 140, 230, .35), inset 0 -3px 0 0 rgba(10, 4, 30, .35), 2px 3px 0 3px rgba(0, 0, 0, .45); }
.v11 .tt i.gl, .vx { position: absolute; width: 4px; height: 4px; background: #fff; box-shadow: 0 0 0 1px #fff6c8; transform: rotate(45deg); }
.v11 .tt i.gl.a { left: 1.1em; top: -1px; } .v11 .tt i.gl.b { right: 1.6em; bottom: -1px; width: 3px; height: 3px; }
.v11 .tt b { position: relative; font-size: 1.45em; color: #fff7d6;
  text-shadow: 2px 0 var(--o), -2px 0 var(--o), 0 2px var(--o), 0 -2px var(--o), 2px 2px var(--o), -2px 2px var(--o), 2px -2px var(--o), -2px -2px var(--o),
    4px 4px 0 #000, 3px 4px 0 #000, 4px 3px 0 #000, 4px 2px 0 #000, 2px 4px 0 #000; }
.v11 .tt b::after { content: attr(data-t); position: absolute; inset: 0; color: transparent; text-shadow: none; background: linear-gradient(#fff7d6 0 52%, #d9c690 52% 100%); -webkit-background-clip: text; background-clip: text; }
.v11 .tt::before, .v11 .tt::after { content: ''; position: absolute; top: 50%; width: calc(var(--wh) * 175 / 196); height: var(--wh); margin-top: calc(var(--wh) * -.42); background: url(/assets/iandragon_game/ai/result/banner_win_open.webp) 0 0 / calc(var(--wh) * 720 / 196) var(--wh) no-repeat; }
.v11 .tt::before { right: calc(100% - .55em); }
.v11 .tt::after { left: calc(100% - .55em); background-position: calc(var(--wh) * -545 / 196) 0; }
/* 12 = 11 정정 (11/14 대표님) : 반짝이 점 2개 지움 (안 시킨 것) · 글씨 = 9번 크기(1.5em) + 위아래 두 톤 · 알약 높이 = 9번(2.5em)보다 한 칸 낮게(2.3em)
 *  · 좌우 여백 = 글자 1개 반 · 알약 어두운 줄 = 글씨 나눈 줄(52%)보다 조금 아래(64%) · 날개 = 11번 그대로 */
.v12 .tt { --wh: 3.3em; height: 2.3em; padding: 0 2.25em; top: calc(var(--fs) * -.7 - 5px); border: 2px solid transparent; border-radius: 1.2em;
  background: linear-gradient(#433578 0%, #35296a 63%, #271c4a 64%, #241a44 100%) padding-box,
              linear-gradient(#fff0b8 0%, #f2c45a 30%, #d9a441 60%, #a8742a 100%) border-box;
  box-shadow: 0 0 0 3px var(--o), 2px 3px 0 3px rgba(0, 0, 0, .45); }
.v12 .tt b { position: relative; font-size: 1.5em; color: #fff7d6;
  text-shadow: 2px 0 var(--o), -2px 0 var(--o), 0 2px var(--o), 0 -2px var(--o), 2px 2px var(--o), -2px 2px var(--o), 2px -2px var(--o), -2px -2px var(--o),
    4px 4px 0 #000, 3px 4px 0 #000, 4px 3px 0 #000, 4px 2px 0 #000, 2px 4px 0 #000; }
.v12 .tt b::after { content: attr(data-t); position: absolute; inset: 0; color: transparent; text-shadow: none; background: linear-gradient(#fff7d6 0 52%, #d9c690 52% 100%); -webkit-background-clip: text; background-clip: text; }
.v12 .tt i.gl { display: none; }
.v12 .tt::before, .v12 .tt::after { content: ''; position: absolute; top: 50%; width: calc(var(--wh) * 175 / 196); height: var(--wh); margin-top: calc(var(--wh) * -.42); background: url(/assets/iandragon_game/ai/result/banner_win_open.webp) 0 0 / calc(var(--wh) * 720 / 196) var(--wh) no-repeat; }
.v12 .tt::before { right: calc(100% - .55em); }
.v12 .tt::after { left: calc(100% - .55em); background-position: calc(var(--wh) * -545 / 196) 0; }
/* 4 꼬리 리본 (ribbon · 보라 갈색 — 빨강 아님) */
.v4 .tt { height: 2.8em; min-width: 14em; padding: 0 3em .25em; border: solid transparent; border-width: .6em 2.6em; border-image: url(/assets/iandragon_game/ai/result/ribbon.webp) 40 150 fill / .6em 2.6em stretch; }
/* 5 날개 현판 (승리 창 날개 + 짙은 알약) */
.v5 .tt { --wh: 2.9em; height: 2.3em; padding: 0 1.4em; border: 3px solid var(--o); border-radius: 1.2em; background: linear-gradient(#3d2f6a 0 50%, #2c2150 50%); box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 var(--o); }
.v5 .tt::before, .v5 .tt::after { content: ''; position: absolute; top: 50%; width: calc(var(--wh) * 175 / 196); height: var(--wh); margin-top: calc(var(--wh) * -.42); background: url(/assets/iandragon_game/ai/result/banner_win_open.webp) 0 0 / calc(var(--wh) * 720 / 196) var(--wh) no-repeat; }
.v5 .tt::before { right: calc(100% - .5em); }
.v5 .tt::after { left: calc(100% - .5em); background-position: calc(var(--wh) * -545 / 196) 0; }
</style>

<script>
const v = new URLSearchParams(location.search).get('v') || '1';
document.body.classList.add('v' + v);
fill('g', ITEMS.map((i) => cardHTML(i)).join(''));
tag({ 1: '제목 1 — 폴더 탭 : 창 판이 위로 솟음 (그림 0)', 2: '제목 2 — 화려한 남색 알약 (결과 창 그림)', 3: '제목 3 — 뾰족 현판 (결과 창 그림)', 4: '제목 4 — 꼬리 리본 (보라 · 빨강 아님)', 5: '제목 5 — 날개 현판 (승리 창 날개)', 12: '날개 현판 (정정 2)', 11: '날개 현판 (정정)', 10: '날개 현판 최종', 9: '날개 현판 확정안 — 금테 알약 · 넉넉한 여백 · 살짝 큰 알약 · 그림자', 7: '제목 5 다듬기 — 한 색 판 · 글씨 검은 테 2px · 리본만큼 크게', 8: '제목 5 다듬기 (판 없이) — 날개 + 글씨만', 6: '제목 3 다듬기 — 창보다 살짝 어두운 색 · 2px 위 · 두꺼운 검은 테만' }[v]);
</script>
