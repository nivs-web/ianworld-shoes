<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="data.js"></script>
<style>
.pill { display:flex; align-items:center; gap:.4em; height:1.9em; padding:0 .7em; border-radius:1em; background:var(--bg2); box-shadow:0 0 0 2px var(--o), inset 0 0 0 1px #5a4a8a; font-size:.85em; white-space:nowrap; }
.pill b { color: var(--gold-hi); }
.gauge { position:relative; height:.9em; border:2px solid var(--o); border-radius:.5em; background:#150a26; box-shadow:inset 0 0 0 1px #5a4a8a; overflow:hidden; }
.gauge > i { display:block; height:100%; background:linear-gradient(#ffe27a 0 50%, #d9a441 50%); }
.rbtn .cnt { margin-left:auto; font-size:.72em; color:var(--sub); text-shadow:1px 1px 0 var(--o); }
.rbtn.on .cnt { color:#fff; }
.rbtn .badge { right:.3em; top:-.5em; }
.tile { padding:.3em .25em .25em; gap:.1em; }
.tile .art { height:3.1em; position:relative; }
.tile .art img { max-height:2.8em; }
.tile .nm { font-size:.7em; line-height:1.15; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile .nw { position:absolute; left:-.3em; top:-.3em; z-index:2; padding:.05em .3em; border-radius:5px; background:#ff3b30; box-shadow:0 0 0 2px var(--o); font-size:.62em; font-style:normal; }
.tile.sel { box-shadow: inset 0 0 0 2px var(--gold-hi), 0 0 0 2px var(--o); background:#3a2c66; }
.tile.off { background:#1a1230; }
.tile.off .art img { filter: brightness(0) opacity(.45); }
.tile.off .art::after { content:'?'; position:absolute; inset:0; display:grid; place-items:center; font-size:1.7em; color:#b8aee0; text-shadow:var(--t2); }
.tile.off .nm { color:var(--mute); }
.tile .art img.world { width:100%; height:100%; max-width:none; max-height:none; object-fit:cover; border-radius:5px; }
.stat { display:flex; align-items:center; gap:.4em; font-size:.76em; }
.stat span { flex:none; width:3.4em; color:var(--sub); text-shadow:1px 1px 0 var(--o); }
.stat i { flex:1; height:.85em; border:2px solid var(--o); border-radius:.45em; background:#150a26; box-shadow:inset 0 0 0 1px #5a4a8a; overflow:hidden; }
.stat i b { display:block; height:100%; }
.stat .gr { background:linear-gradient(#7cf08a 0 50%, #32a948 50%); } .stat .or { background:linear-gradient(#ffc070 0 50%, #e0852c 50%); }
.stat .bl { background:linear-gradient(#7cc0ff 0 50%, #3a7fd8 50%); } .stat .pu { background:linear-gradient(#c8a8ff 0 50%, #8a5ee0 50%); }
.stats { display:flex; flex-direction:column; gap:.3em; }
.stage { position:relative; flex:1 1 auto; min-height:0; display:grid; place-items:center; border-radius:8px; background:radial-gradient(ellipse at 50% 80%, #4d3d86, #241a40 72%); box-shadow:inset 0 0 0 2px var(--o), inset 0 0 0 3px #5a4a8a; overflow:hidden; }
.stage > img { position:absolute; left:8%; top:8%; width:84%; height:84%; object-fit:contain; }
.stage .tl { position:absolute; left:.4em; top:.4em; display:flex; gap:.3em; align-items:center; }
.stage .tl .chip { height:1.6em; font-size:.72em; }
.nwb { padding:.1em .45em; border-radius:6px; background:#ff3b30; box-shadow:0 0 0 2px var(--o); font-size:.7em; font-style:normal; }
.dname { font-size:1.15em; color:#fff7d6; text-shadow:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dsub { font-size:.72em; color:var(--sub); text-shadow:1px 1px 0 var(--o); }
.btns { display:flex; gap:.4em; } .btns .btn { flex:1; min-width:0; padding:0 .4em; font-size:.82em; }
.paper.l { text-align:left; }
.chip.leg { background:linear-gradient(#ffe27a 0 50%, #d9a441 50%); color:#4a2c12; text-shadow:none; }
.chip.epic { background:linear-gradient(#c88aff 0 50%, #9a52e0 50%); color:#fff; }
.chip.rare { background:linear-gradient(#7cc0ff 0 50%, #3a7fd8 50%); color:#fff; }
</style>

  dm('kkomul', '꼬물이', '희귀', 'rare', 1, [50, 50, 50, 70], '알 부화장 · 희귀 4.0%'), dm('twetwe', '튀튀', '영웅', 'epic', 1, [65, 70, 55, 85], '알 부화장 · 영웅 2.5%'),
  dm('novart_red', '붉은 노바트', '영웅', 'epic', 0, [75, 80, 55, 60], '알 부화장 · 영웅 2.5%'), dm('aquantis_red', '붉은 아쿠안티스', '영웅', 'epic', 0, [80, 70, 65, 50], '알 부화장 · 영웅 2.5%'),

const IC = (n) => `/assets/iandragon_game/ai/lobby/${n}.png`;
const tile = (it, sel, extra = '') => `<div ${extra} class="card tile ${it.r} ${it.have ? '' : 'off'} ${sel ? 'sel' : ''}">${it.nw && it.have ? '<i class="nw">NEW</i>' : ''}<div class="art"><img src="${it.img}"></div><div class="nm">${it.nm}</div></div>`;
const stat = (l, v, c, on = true) => `<div class="stat"><span>${l}</span><i><b class="${c}" style="width:${on ? v : 0}%"></b></i></div>`;

const SND = `<img src="${IC('ico_sound')}">`;
const goBtnS = (it, st) => it.k === 'd' ? (it.have ? '<span class="btn o">파워업 키우기 ›</span>' : '<span class="btn o">부화장 가기 ›</span>') : `<span class="btn r">${st} 싸우러 가기</span>`;
const btns2 = (it, st) => `<div class="btns"><span class="btn p">${SND}다시 듣기</span>${goBtnS(it, st)}</div>`;

<div class="scene"></div>
<style>#tn .nm{display:none} #tn .tile .art{height:3.6em} #tn .tile .art img{max-height:3.3em}</style><div class="win">

      <div id="bk" style="flex:1;min-width:0;display:flex;border-radius:10px;border:2px solid var(--o);box-shadow:inset 0 0 0 1px var(--gold), 0 3px 0 var(--o);overflow:hidden"></div>

    </div>
    <div style="flex:none;display:flex;align-items:center;gap:.5em">

</div>

</script>
<script>tag('도감 C — 책 펼침 (왼쪽 그림 쪽 · 오른쪽 설명 쪽) + ‹ › 넘기기 + 아래 작은 그림 줄');</script>
