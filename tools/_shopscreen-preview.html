<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>아이템 쇼핑 미리보기</title>
<link rel="stylesheet" href="/src/styles/reset.css">
<link rel="stylesheet" href="/src/styles/pixel-ui.css">
<link rel="stylesheet" href="/src/styles/screens.css">
<!--
  ★ `?nowms=…` 이면 그 시각으로 굳힌다 (2026-08-21 32차).
  하루 5분만 열리는 할인 창을 검사하려면 시각을 손에 쥐어야 하는데, 이 게임에는
  "지금"을 밖에서 넣는 통로가 없다 — 있으면 그게 곧 값을 속이는 통로다.
  그래서 **검사 페이지에서만** `Date.now` 를 갈아 끼운다. 모듈 스크립트보다 먼저
  도는 평범한 스크립트라 화면 코드도 저장소 대역도 같은 시각을 본다.
-->
<script>
  (function () {
    var v = Number(new URLSearchParams(location.search).get('nowms'));
    if (Number.isFinite(v) && v > 0) Date.now = function () { return v; };
  })();
</script>
<!-- 진짜 ItemShop.js 를 그대로 띄운다. 바꾸는 것은 profile.js 하나뿐. -->
<script type="importmap">
{ "imports": { "/src/services/profile.js": "/tools/_shop-stub.js" } }
</script>
</head>
<body class="ui-mode">
<div id="ui" class="active"></div>
<script type="module">
import ItemShop from '/src/screens/ItemShop.js';
const root = document.getElementById('ui');
let live = null;
const nav = {
  refresh() { if (!live) return; root.innerHTML = ''; root.append(live.render(nav)); },
  back() {}, push() {}, reset() {},
};
live = ItemShop(nav);
nav.refresh();
</script>
</body></html>
