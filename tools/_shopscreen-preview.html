<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>아이템 쇼핑 미리보기</title>
<link rel="stylesheet" href="/src/styles/reset.css">
<link rel="stylesheet" href="/src/styles/pixel-ui.css">
<link rel="stylesheet" href="/src/styles/screens.css">
<!-- 진짜 ItemShop.js 를 그대로 띄운다. 바꾸는 것은 profile.js 하나뿐. -->
<script type="importmap">
{ "imports": { "/src/services/profile.js": "/tools/_shop-stub.js" } }
</script>
</head>
<body class="ui-mode">
<div id="ui" class="active"></div>
<script type="module">
import ItemShop from '/src/screens/ItemShop.js';
const root = document.getElementById('ui');
let live = null;
const nav = {
  refresh() { if (!live) return; root.innerHTML = ''; root.append(live.render(nav)); },
  back() {}, push() {}, reset() {},
};
live = ItemShop(nav);
nav.refresh();
</script>
</body></html>
