<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>아이템 쇼핑 미리보기</title>
<link rel="stylesheet" href="/src/styles/reset.css">
<link rel="stylesheet" href="/src/styles/pixel-ui.css">
<link rel="stylesheet" href="/src/styles/screens.css">
<style>body{background:#1b1410;padding:12px}.frame{max-width:400px;margin:0 auto;background:#0d0a08;padding:10px;border:2px solid #4a3b2a}</style>
<script type="importmap">
{ "imports": { "/src/services/profile.js": "/tools/_dragon-stub.js" } }
</script>
</head>
<body class="ui-mode">
<div class="frame"><div id="ui" class="active"></div></div>
<script type="module">
/**
 * 드래곤 화면 전수 점검 — 하나씩 띄워서 터지는지, 빈 화면인지 본다.
 * 라우터 없이 부르므로 nav 는 흉내만 낸다.
 */
const SCREENS = [
  ['DragonLobby',    '/src/screens/DragonLobby.js',    {}],
  ['DragonShop',     '/src/screens/DragonShop.js',     {}],
  ['DragonItems',    '/src/screens/DragonItems.js',    {}],
  ['DragonSettings', '/src/screens/DragonSettings.js', {}],
  ['DragonKeys',     '/src/screens/DragonKeys.js',     {}],
  ['DragonSound',    '/src/screens/DragonSound.js',    {}],
  ['DragonNickname', '/src/screens/DragonNickname.js', {}],
  ['DragonRanking(점수)', '/src/screens/DragonRanking.js', { kind:'score' }],
  ['DragonRanking(금화)', '/src/screens/DragonRanking.js', { kind:'coin' }],
  ['DragonMultiMenu','/src/screens/multi/DragonMultiMenu.js', {}],
  ['DuelResult',     '/src/screens/multi/DuelResult.js', { code:'TEST' }],
];
const root = document.getElementById('ui');
const errs = [];
window.addEventListener('error', (e) => errs.push('window: ' + e.message));
window.addEventListener('unhandledrejection', (e) => errs.push('promise: ' + (e.reason?.message ?? e.reason)));

window.__sweep = async function () {
  const out = [];
  for (const [name, path, opt] of SCREENS) {
    const before = errs.length;
    let live = null;
    const nav = { refresh(){ try{ root.innerHTML=''; root.append(live.render(nav)); }catch(e){ errs.push(name+' render: '+e.message); } },
                  back(){}, push(){}, replace(){}, reset(){} };
    try {
      const mod = await import(path);
      live = mod.default(nav, opt);
      nav.refresh();
      await new Promise((r) => setTimeout(r, 900));
      const txt = (root.textContent || '').replace(/\s+/g, ' ').trim();
      const btns = root.querySelectorAll('button').length;
      const bad = /undefined|NaN|\[object/.test(txt);
      out.push([name, txt.length ? 'OK' : '★빈화면', btns + '버튼',
                bad ? '★깨진문구' : '', errs.length > before ? '★오류' : ''].filter(Boolean).join('  '));
      if (live.onLeave) live.onLeave();
    } catch (e) {
      out.push(name + '  ★터짐: ' + e.message);
    }
  }
  return { rows: out, errs };
};
window.__ready = true;
</script></body></html>
