<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>세로 모드 확인</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}#host{width:100vw;height:100vh}</style>
</head><body><div id="host"></div>
<script type="module">
/**
 * ★ **소리를 아예 못 낸다.** (2026-08-27, 사용자 지정 — "영화 보고 있으니 소리 끄고")
 * 게임 모듈을 불러오기 **전에** AudioContext 를 지운다. `SND.init()` 은
 * `window.AudioContext` 가 없으면 `ready=false` 로 조용히 넘어가도록 이미
 * 짜여 있다 — 옵션(bgmOn/sfxOn)을 끄는 것보다 이쪽이 훨씬 확실하다.
 * 옵션은 사람이 바꿀 수 있지만 이 값은 스크립트가 시작하기 전에 이미 없다.
 */
window.AudioContext = undefined;
window.webkitAudioContext = undefined;

/** 세로 모드를 눈으로 확인하는 자리. 게임을 실제로 띄우고 몇 초 돌린다. */
import * as DR from '/src/games/dragon/dragon.js';
const MODE = new URLSearchParams(location.search).get('mode') || 'play';
DR.mount(document.getElementById('host'),
  { onExit(){}, onEnd(){}, onProgress(){}, onGhost(g){ window.__ghosts.push(g); },
    difficulty:'normal', mode: MODE, code: 'TEST', seed: 12345 });
/**
 * 결투 순위표를 보려면 상대가 있어야 한다 — 가짜 상대를 uid 별로 넣는다.
 * (2026-08-27, 최대 4인으로 확장 — `setDuelPeer` 가 uid 를 받게 바뀌었다)
 */
window.__peer = (uid, o) => DR.setDuelPeer(uid, o);
/** 게임이 밖으로 보내는 고스트를 받아 둔다 (실제 방 대신) */
window.__ghosts = [];
const T = DR.__test;
window.__T = T; window.__DR = DR;
window.__toGame = (n) => { for(let i=0;i<400 && T.scene!=='GameScene';i++){ T.press('confirm'); T.pump(1/60); }
  for(let i=0;i<(n|0);i++) T.pump(1/60); return T.scene; };
window.__shot = () => document.querySelector('#host canvas').toDataURL('image/png');
/** 화면을 잘라 파일로 보낸다. 도구 결과로 실어 나르면 문맥이 금방 찬다 */
window.__save = (name, sx, sy, sw, sh, zoom) => {
  const src = document.querySelector('#host canvas');
  sx = sx|0; sy = sy|0; sw = sw || src.width; sh = sh || src.height; zoom = zoom || 1;
  const t = document.createElement('canvas');
  t.width = Math.round(sw*zoom); t.height = Math.round(sh*zoom);
  const g = t.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(src, sx, sy, sw, sh, 0, 0, t.width, t.height);
  return fetch('http://localhost:4191/', { method:'POST',
    body: JSON.stringify({ name, data: t.toDataURL('image/png') }) }).then(r => r.text());
};
/** 판 좌표를 화면 좌표로 (세로 기준) */
window.__scr = o => ({ x: o.y, y: 1280 - o.x });
</script></body></html>
