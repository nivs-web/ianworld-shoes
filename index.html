<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>오락실 이안월드 · 신발을 찾아서</title>

<!-- 모바일 세로 전용. 확대/축소 금지, 노치 영역까지 사용 -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b1410" />
<meta name="description" content="맨발로 신발 상자 계단을 오르며 130종 신발을 모으는 레트로 도트 게임" />

<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="이안월드" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="icon" href="/icons/icon-192.png" />

<link rel="stylesheet" href="/src/styles/reset.css" />
<link rel="stylesheet" href="/src/styles/pixel-ui.css" />
<link rel="stylesheet" href="/src/styles/screens.css" />
</head>
<body>
  <!-- 인게임: Canvas 하나가 전부. HUD도 여기 그린다. -->
  <div id="stage">
    <canvas id="game" width="180" height="320"></canvas>
  </div>

  <!-- 로비/메뉴: DOM 화면이 여기에 마운트된다 -->
  <div id="ui"></div>

  <!-- 로딩 -->
  <div id="boot">
    <div class="boot-logo">오락실 이안월드</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
